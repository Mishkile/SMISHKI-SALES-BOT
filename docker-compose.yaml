services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: jsts-salebot # Easier to find in 'docker ps'
    command: go run .
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    depends_on:
      mongoserver:
        condition: service_healthy

  mongoserver:
    image: mongo:latest
    restart: always
    command: [ "mongod", "--quiet" ]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  mongo-express:
    image: mongo-express:latest
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongoserver
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_URL=mongodb://mongoserver:27017
    depends_on:
      mongoserver:
        condition: service_healthy

volumes:
  mongodb_data:
  go-mod-cache:
  go-build-cache:
