name: Retry Dependabot CI

on:
  schedule:
    # pnpm's minimumReleaseAge blocks packages <24h old; recheck a few times a day
    # so PRs go green (and auto-merge) as soon as the package ages past the cutoff.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs on open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=ts-ci.yml --status failure \
            --json databaseId,event,headBranch --jq \
            '.[] | select(.event=="pull_request" and (.headBranch | startswith("dependabot/"))) | .databaseId' |
          while read -r id; do
            echo "Re-running failed jobs for run $id"
            gh run rerun "$id" --repo "$GITHUB_REPOSITORY" --failed
          done
